[package]
name = "plot"
cancho = "0.1.1"   # the compiler release every gate here was run with; move it when a feature needs a later one

[[bin]]
name = "plot"
sources = ["lib/plot", "tools/plot"]   # lib/plot/{num,ticks,csv,axis,dumb,svg,chart}.cho, tools/plot/main.cho
std = true
out = "build/plot"

[[test]]
name = "plot"
sources = ["lib/plot", "tests/plot_test.cho"]
std = true

[[test]]
name = "cases"
sources = ["lib/plot", "tests/plot_cases_test.cho"]
std = true
